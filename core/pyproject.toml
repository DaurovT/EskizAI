[project]
name = "mebel-core"
version = "0.1.0"
description = "Ядро: дерево модулей → модель деталей, правила, смета, раскрой, файлы"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "mapbox-earcut>=2.1.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "rectpack>=0.2.2",
    "reportlab>=5.1.0",
    "shapely>=2.2.0",
    "trimesh>=5.2.0",
]

[project.scripts]
mebel = "mebel_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mebel_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
