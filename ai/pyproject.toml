[project]
name = "mebel-ai"
version = "0.1.0"
description = "ИИ: фото и текст → дерево модулей, уточняющие вопросы, правки словами"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "mebel-core",
]

[tool.uv.sources]
mebel-core = { path = "../core", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mebel-ai = "mebel_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mebel_ai"]
