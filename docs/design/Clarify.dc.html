  ic: answered ? 'ok' : q.k, sym: answered ? '✓' : sym[q.k], t: q.t, tc: answered || q.k === 'i' ? 'done' : '',
  hasDl: !!q.dl && !answered, showPicked: !!answered, val: answered ? q.o[v] : '',
  edit: () => this.setState({ open: { ...st.open, [i]: true } }),
  showOpts: !!q.o && !answered,
  opts: (q.o || []).map((t, j) => ({ t, cl: v === j ? 'on' : '', pick: () => this.setState({ a: { ...st.a, [i]: j }, open: { ...st.open, [i]: false } }) })).concat(q.k === 'q' ? [{ t: 'Не знаю', cl: 'ghost', pick: () => this.setState({ a: { ...st.a, [i]: 0 } }) }] : [])
 };
});
const done = [0, 2, 3].filter(i => st.a[i] !== null && st.a[i] !== undefined).length;
return { items, done, hl: active >= 0 ? Q[active].hl : 'Всё уточнено' };
}
}
