<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обновление и техработы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/*V3*/
body{margin:0}
a{color:#2F6B44;text-decoration:none}a:hover{color:#275C3A}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{width:390px;height:844px;box-sizing:border-box;background:#F2F1EE;font-family:Onest,system-ui,sans-serif;color:#21201F;display:flex;flex-direction:column;position:relative;overflow:hidden;font-size:16px;line-height:22px;font-weight:400;letter-spacing:-.005em}
.mono,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hdr{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 4px;min-height:56px}
.ht{flex:1;min-width:0;font-size:18px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#21201F;position:relative}
.ib.flat{background:transparent}
.ib .badge{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#E5352B;box-shadow:0 0 0 2px #fff}
.big{flex:none;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.025em;padding:4px 16px 0}
.title{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:16px;line-height:22px;color:#6E6B66}
.cap{font-size:14px;line-height:19px;font-weight:400;color:#6E6B66}
.lbl{font-size:15px;line-height:20px;font-weight:600;color:#6E6B66;letter-spacing:0;text-transform:none}
.body{flex:1;min-height:0;overflow:hidden;padding:8px 12px 12px;display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.sheet{background:#fff;border-radius:28px;overflow:hidden;flex:none}
.pad{padding:20px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 20px;box-sizing:border-box;color:#21201F;position:relative}
.row+.row{box-shadow:inset 0 1px 0 #F0EFEC}
.row .tx{flex:1;min-width:0}
.rt{font-size:16px;line-height:21px;font-weight:500}
.rs{font-size:14px;line-height:19px;font-weight:400;color:#6E6B66}
.rv{font-size:16px;line-height:21px;font-weight:600;white-space:nowrap;color:#21201F;font-variant-numeric:tabular-nums}
.chev{flex:none;color:#B4B1AB}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.st{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:9px;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;background:#F2F1EE;color:#55524D}
.st .dot{display:none}
.st.c-green{background:#E6F1EA}.st.c-amber{background:#FFF0D4}.st.c-blue{background:#E6EEFF}.st.c-red{background:#FFE7E4}.st.c-gray{background:#F2F1EE}
.d-green{background:#387D50}.d-amber{background:#E08A00}.d-blue{background:#1F4FBF}.d-red{background:#E5352B}.d-gray{background:#A3A09A}
.c-green{color:#275C3A}.c-amber{color:#8A4B00}.c-blue{color:#1F4FBF}.c-red{color:#A1221A}.c-gray{color:#55524D}
.foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px 30px}
.foot.bar{background:#fff;border-radius:28px 28px 0 0;padding:16px 16px 30px}
.fr{display:flex;gap:8px}
.cta{height:56px;border-radius:16px;background:#387D50;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;font-size:17px;line-height:22px;font-weight:600;box-sizing:border-box;white-space:nowrap}
.fr>.cta,.fr>.soft{flex:1}
.cta:hover{color:#fff;background:#2F6B44}
.cta.val{justify-content:space-between;padding:0 8px 0 20px}
.cta .v{height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cta.off{background:#E6E5E1;color:#8E8B85}
.soft{height:56px;border-radius:16px;background:#fff;color:#21201F;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-size:17px;line-height:22px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.soft:hover{color:#21201F;background:#F7F7F5}
.soft.sm,.cta.sm{height:44px;border-radius:14px;font-size:15px;padding:0 14px;flex:none}
.soft.w{background:#fff}
.txt{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:500;color:#2F6B44}
.txt.red{color:#C62A20}
.seg{display:flex;background:#E6E5E1;border-radius:14px;padding:3px;gap:2px;flex:none}
.sg{flex:1;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:20px;font-weight:500;color:#21201F;white-space:nowrap;padding:0 8px}
.sg.on{background:#fff;color:#21201F;box-shadow:0 1px 3px rgba(33,32,31,.10)}
.chips{display:flex;gap:8px;overflow:hidden;flex:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chip{height:40px;border-radius:20px;background:#fff;color:#21201F;display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:#21201F;color:#fff}
.chip .n{color:#9C9993}.chip.on .n{color:#A9A6A0}
.opt{min-height:56px;border-radius:16px;background:#fff;color:#21201F;display:flex;align-items:center;gap:12px;padding:10px 16px;box-sizing:border-box;font-size:16px;font-weight:500}
.opt.on{background:#21201F;color:#fff}
.opt.on .rs{color:#B4B1AB}
.fld{background:#fff;border-radius:16px;min-height:60px;padding:9px 16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.fld .fl{font-size:13px;line-height:17px;font-weight:400;color:#6E6B66;letter-spacing:0;text-transform:none}
.fld .fv{font-size:17px;line-height:23px;font-weight:500;color:#21201F}
.fld .ph{font-size:17px;line-height:23px;font-weight:400;color:#8E8B85}
.fld.focus{background:#fff;box-shadow:inset 0 0 0 2px #21201F}
.fld.err{background:#FFF5F4;box-shadow:inset 0 0 0 2px #E5352B}
.fld.est{background:#FFF9EE;box-shadow:inset 0 0 0 2px #F3CF8F}
.numf{display:flex;align-items:center;gap:8px}
.numf .nval{flex:1;font-size:28px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums}
.numf .nu{font-size:14px;color:#6E6B66}
.pm{width:40px;height:40px;border-radius:12px;background:#F2F1EE;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;color:#21201F;flex:none}
.search{height:48px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;color:#8E8B85;font-size:16px;flex:none}
.ban{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex:none}
.ban .bt{font-size:16px;line-height:21px;font-weight:600}
.ban .bd{font-size:14px;line-height:19px;font-weight:400}
.ban.ok{background:#E6F1EA;color:#1F4A2F}.ban.est{background:#FFF0D4;color:#6E3C00}.ban.info{background:#E6EEFF;color:#1A3F99}.ban.err{background:#FFE7E4;color:#8A1D16}.ban.n{background:#fff;color:#21201F}
.ban .ba{margin-left:auto;align-self:center;font-size:15px;font-weight:600;color:inherit;min-height:44px;display:flex;align-items:center;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.tag.est{background:#FFF0D4;color:#8A4B00}.tag.info{background:#E6EEFF;color:#1F4FBF}.tag.ok{background:#E6F1EA;color:#275C3A}.tag.n{background:#F2F1EE;color:#55524D}.tag.err{background:#FFE7E4;color:#A1221A}
.nav{flex:none;height:84px;background:#fff;border-radius:24px 24px 0 0;display:flex;align-items:flex-start;justify-content:space-around;padding:8px 4px 0;box-sizing:border-box}
.nv{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:15px;font-weight:500;color:#8E8B85}
.nv:hover{color:#21201F}
.nv .ni{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nv.on{color:#21201F}
.nv.on .ni{background:#E6F1EA;color:#275C3A}
.plus{width:52px;height:44px;border-radius:16px;background:#387D50;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:2px}
.plus:hover{color:#fff;background:#2F6B44}
.thumb{width:56px;height:56px;flex:none;border-radius:16px;background:#F4EBDD;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#EDECE9;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#21201F}
.tile{width:44px;height:44px;flex:none;border-radius:14px;background:#F2F1EE;display:flex;align-items:center;justify-content:center;color:#21201F}
.ic24{width:24px;height:24px;flex:none}
.scrim{position:absolute;inset:0;background:rgba(33,32,31,.42);z-index:5}
.bs{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#F2F1EE;border-radius:28px 28px 0 0;padding:0 12px 30px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -4px 24px rgba(33,32,31,.10)}
.bs.white{background:#fff}
.hdl{height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.hdl i{width:40px;height:5px;border-radius:3px;background:#D6D4CF;display:block}
.toast{position:absolute;left:12px;right:12px;z-index:7;min-height:56px;border-radius:18px;background:#21201F;color:#fff;display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;box-sizing:border-box;font-size:15px;font-weight:400}
.toast .ta{margin-left:auto;min-height:44px;padding:0 12px;display:flex;align-items:center;font-weight:600;color:#8FD3A6}
.lift{box-shadow:0 4px 16px rgba(33,32,31,.12)}
.tog{width:51px;height:31px;border-radius:16px;background:#E1DFDB;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tog.on{background:#387D50}.tog.on::after{left:22px}
.hair{height:1px;background:#F0EFEC;flex:none}
.big-n{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;box-sizing:border-box;flex:none}
.wood{background:repeating-linear-gradient(90deg,#E6D3B1 0 7px,#DCC59F 7px 9px)}
.carc{border:3px solid #21201F;box-sizing:border-box;background:#21201F}
/* inside white containers controls go gray */
:is(.sheet,.foot.bar,.bs.white,.chat,.pad,.ban.n,.dlg) :is(.soft,.chip:not(.on),.opt:not(.on),.fld:not(.focus):not(.err):not(.est),.search,.ib:not(.keep)){background:#F2F1EE}
:is(.sheet,.foot.bar,.bs.white,.chat,.pad,.dlg) .seg{background:#EDECE9}
/* motion v3: press + mount */
.cta,.soft,.chip,.ib,.opt,.sg,.pm,.txt,.plus,.nv,.tile,a.row,button.row,a.sheet,.svc,.ans,.key,.qv,.tl,.vb,.dimb{transition:transform .12s cubic-bezier(.2,0,0,1),filter .12s,background-color .2s,color .2s,box-shadow .2s}
.cta:active,.soft:active,.chip:active,.ib:active,.opt:active,.pm:active,.plus:active,.svc:active,.ans:active,.key:active,.qv:active,.tl:active,.vb:active,.dimb:active,a.sheet:active{transform:scale(.97);filter:brightness(.94)}
a.row:active,button.row:active{background-color:#F7F7F5}
.txt:active,.nv:active{opacity:.6}
@keyframes v3up{from{transform:translateY(100%)}to{transform:none}}
@keyframes v3fin{from{opacity:0}to{opacity:1}}
@keyframes v3tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes v3dlg{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes v3spin{to{transform:rotate(360deg)}}
.scrim{animation:v3fin .2s ease-out both}
.bs{animation:v3up .32s cubic-bezier(.32,.72,0,1) both}
.toast{animation:v3tin .2s cubic-bezier(.2,0,0,1) both}
.dlg{animation:v3dlg .2s cubic-bezier(.2,0,0,1) both}
.spin{animation:v3spin .8s linear infinite}
.chat,.sheetm{transition:height .35s cubic-bezier(.32,.72,0,1)}
@media (prefers-reduced-motion:reduce){.bs,.toast,.dlg{animation-name:v3fin}.cta:active,.soft:active,.chip:active,.ib:active{transform:none}}
/*/V3*/

.seg2{display:flex;background:#fff;border-radius:20px;padding:3px;gap:2px}
.seg2 button{height:34px;border-radius:17px;font-size:13px;font-weight:500;padding:0 12px;color:#21201F}
.seg2 button.on{background:#21201F;color:#fff}
.ttl{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.025em}
</style>
</helmet>
<div class="app">
<div class="hdr" style="justify-content:center"><div class="seg2" role="group" aria-label="Демо"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.on}}" onClick="{{t.pick}}">{{t.t}}</button></sc-for></div></div>
<div class="body" style="align-items:center;justify-content:center;text-align:center;gap:14px">
<div style="position:relative"><svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#387D50"/><path d="M79.2 78.5 L66.2 86.0 L66.2 44.9 L79.2 37.4Z" fill="#fff" opacity="0.55"/><path d="M38.7 14.0 L79.2 37.4 L66.2 44.9 L25.7 21.5Z" fill="#fff" opacity="0.85"/><path d="M20.8 59.8 L66.2 86.0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M25.7 67.1 L25.7 21.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M46.0 74.3 L46.0 33.2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></svg><sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;border-radius:50%;background:#FFF0D4;color:#8A4B00;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #F2F1EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></span></sc-if><sc-if value="{{isUpd}}" hint-placeholder-val="{{ true }}"><span style="position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;border-radius:50%;background:#E6F1EA;color:#275C3A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #F2F1EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg></span></sc-if></div>
<div class="ttl" style="margin-top:6px">{{title}}</div>
<div class="cap" style="font-size:15px;line-height:21px;max-width:310px">{{text}}</div>
<sc-if value="{{isUpd}}" hint-placeholder-val="{{ true }}"><div class="sheet" style="width:100%;text-align:left;margin-top:6px">
<div class="row"><span class="tile" style="width:36px;height:36px;border-radius:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></span><span class="tx rt">Угловые кухни в редакторе</span></div>
<div class="row"><span class="tile" style="width:36px;height:36px;border-radius:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15.5L15.5 4 20 8.5 8.5 20z"/><path d="M8 12l2 2M10.5 9.5l1.5 1.5M13 7l2 2"/></svg></span><span class="tx rt">Замер кухни по стенам</span></div>
</div></sc-if>
<sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}"><div class="sheet" style="width:100%;text-align:left;margin-top:6px">
<div class="row"><span class="tile" style="width:36px;height:36px;border-radius:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></span><div class="tx"><div class="rt">Закончим к 14:00</div><div class="rs">по Ташкенту, примерно через 40 минут</div></div></div>
<div class="row"><span class="tile" style="width:36px;height:36px;border-radius:12px;background:#E6F1EA;color:#275C3A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><div class="tx"><div class="rt">Проекты сохранены</div><div class="rs">ссылки клиентам продолжают работать</div></div></div>
</div></sc-if>
</div>
<div class="foot">
<sc-if value="{{isUpd}}" hint-placeholder-val="{{ true }}"><a class="cta" href="SystemStates.dc.html">Обновить</a></sc-if>
<sc-if value="{{isOpt}}" hint-placeholder-val="{{ false }}"><a class="txt" href="Projects.dc.html" style="color:#21201F">Позже</a></sc-if>
<sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}"><button class="cta" onClick="{{retry}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 .5 6"/><path d="M19.5 4v4.5H15"/></svg>Проверить снова</button><a class="txt" href="SystemStates.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5L3.5 11.5l5 1.8L18 7.5l-7.5 7v4.5l3-3 4 3z"/></svg>Поддержка в Telegram</a></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { t: 0 }; }
renderVals() {
const t = this.state.t;
const T = ['Обязательное', 'Можно позже', 'Техработы'];
const title = ['Обновите приложение', 'Вышла новая версия', 'Идут технические работы'][t];
const text = ['Эта версия Eskiz больше не поддерживается. Обновите, чтобы продолжить: проекты и клиенты сохранятся.', 'Обновите, чтобы получить новые возможности. Можно и позже: всё продолжит работать.', 'Улучшаем Eskiz. Создание и правка проектов временно недоступны.'][t];
return { tabs: T.map((x, i) => ({ t: x, on: i === t ? 'on' : '', pick: () => this.setState({ t: i }) })),
isUpd: t < 2, isOpt: t === 1, isWork: t === 2, title, text, retry: () => this.setState({ t: 2 }) };
}
}
</script>
