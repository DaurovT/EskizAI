.big{flex:none;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.025em;padding:4px 16px 0}
.title{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:16px;line-height:22px;color:#6E6B66}
.cap{font-size:14px;line-height:19px;font-weight:400;color:#6E6B66}
.lbl{font-size:15px;line-height:20px;font-weight:600;color:#6E6B66;letter-spacing:0;text-transform:none}
.body{flex:1;min-height:0;overflow:hidden;padding:8px 12px 12px;display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.sheet{background:#fff;border-radius:28px;overflow:hidden;flex:none}

.numf .nu{font-size:14px;color:#6E6B66}
.pm{width:40px;height:40px;border-radius:12px;background:#F2F1EE;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;color:#21201F;flex:none}
.search{height:48px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;color:#8E8B85;font-size:16px;flex:none}
.ban{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex:none}
.ban .bt{font-size:16px;line-height:21px;font-weight:600}
.ban .bd{font-size:14px;line-height:19px;font-weight:400}
.ban.ok{background:#E6F1EA;color:#1F4A2F}.ban.est{background:#FFF0D4;color:#6E3C00}.ban.info{background:#E6EEFF;color:#1A3F99}.ban.err{background:#FFE7E4;color:#8A1D16}.ban.n{background:#fff;color:#21201F}
.ban .ba{margin-left:auto;align-self:center;font-size:15px;font-weight:600;color:inherit;min-height:44px;display:flex;align-items:center;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.tag.est{background:#FFF0D4;color:#8A4B00}.tag.info{background:#E6EEFF;color:#1F4FBF}.tag.ok{background:#E6F1EA;color:#275C3A}.tag.n{background:#F2F1EE;color:#55524D}.tag.err{background:#FFE7E4;color:#A1221A}
.nav{flex:none;height:84px;background:#fff;border-radius:24px 24px 0 0;display:flex;align-items:flex-start;justify-content:space-around;padding:8px 4px 0;box-sizing:border-box}
.nv{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:15px;font-weight:500;color:#8E8B85}
.nv:hover{color:#21201F}
.nv .ni{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nv.on{color:#21201F}

.plus{width:52px;height:44px;border-radius:16px;background:#387D50;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:2px}
.plus:hover{color:#fff;background:#2F6B44}
.thumb{width:56px;height:56px;flex:none;border-radius:16px;background:#F4EBDD;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#EDECE9;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#21201F}
.tile{width:44px;height:44px;flex:none;border-radius:14px;background:#F2F1EE;display:flex;align-items:center;justify-content:center;color:#21201F}
.ic24{width:24px;height:24px;flex:none}
.scrim{position:absolute;inset:0;background:rgba(33,32,31,.42);z-index:5}
.bs{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#F2F1EE;border-radius:28px 28px 0 0;padding:0 12px 30px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -4px 24px rgba(33,32,31,.10)}
.bs.white{background:#fff}
.hdl{height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.hdl i{width:40px;height:5px;border-radius:3px;background:#D6D4CF;display:block}
.toast{position:absolute;left:12px;right:12px;z-index:7;min-height:56px;border-radius:18px;background:#21201F;color:#fff;display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;box-sizing:border-box;font-size:15px;font-weight:400}
.toast .ta{margin-left:auto;min-height:44px;padding:0 12px;display:flex;align-items:center;font-weight:600;color:#8FD3A6}
.lift{box-shadow:0 4px 16px rgba(33,32,31,.12)}
.tog{width:51px;height:31px;border-radius:16px;background:#E1DFDB;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tog.on{background:#387D50}.tog.on::after{left:22px}
.hair{height:1px;background:#F0EFEC;flex:none}
.big-n{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;box-sizing:border-box;flex:none}
.wood{background:repeating-linear-gradient(90deg,#E6D3B1 0 7px,#DCC59F 7px 9px)}
.carc{border:3px solid #21201F;box-sizing:border-box;background:#21201F}
/* inside white containers controls go gray */
:is(.sheet,.foot.bar,.bs.white,.chat,.pad,.ban.n,.dlg) :is(.soft,.chip:not(.on),.opt:not(.on),.fld:not(.focus):not(.err):not(.est),.search,.ib:not(.keep)){background:#F2F1EE}
:is(.sheet,.foot.bar,.bs.white,.chat,.pad,.dlg) .seg{background:#EDECE9}
/* motion v3: press + mount */
.cta,.soft,.chip,.ib,.opt,.sg,.pm,.txt,.plus,.nv,.tile,a.row,button.row,a.sheet,.svc,.ans,.key,.qv,.tl,.vb,.dimb{transition:transform .12s cubic-bezier(.2,0,0,1),filter .12s,background-color .2s,color .2s,box-shadow .2s}
.cta:active,.soft:active,.chip:active,.ib:active,.opt:active,.pm:active,.plus:active,.svc:active,.ans:active,.key:active,.qv:active,.tl:active,.vb:active,.dimb:active,a.sheet:active{transform:scale(.97);filter:brightness(.94)}
a.row:active,button.row:active{background-color:#F7F7F5}
.txt:active,.nv:active{opacity:.6}
@keyframes v3up{from{transform:translateY(100%)}to{transform:none}}
@keyframes v3fin{from{opacity:0}to{opacity:1}}
@keyframes v3tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes v3dlg{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes v3spin{to{transform:rotate(360deg)}}
.scrim{animation:v3fin .2s ease-out both}
.bs{animation:v3up .32s cubic-bezier(.32,.72,0,1) both}
.toast{animation:v3tin .2s cubic-bezier(.2,0,0,1) both}
.dlg{animation:v3dlg .2s cubic-bezier(.2,0,0,1) both}
.spin{animation:v3spin .8s linear infinite}
.chat,.sheetm{transition:height .35s cubic-bezier(.32,.72,0,1)}
@media (prefers-reduced-motion:reduce){.bs,.toast,.dlg{animation-name:v3fin}.cta:active,.soft:active,.chip:active,.ib:active{transform:none}}
/*/V3*/

.ttl{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.025em;padding:0 4px}
.sh{font-size:17px;line-height:22px;font-weight:700;letter-spacing:-.01em;padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.sh span{font-size:13px;font-weight:500;color:#6E6B66}
.hero{flex:none;height:104px;border-radius:24px;background:#F4EBDD;display:flex;align-items:center;justify-content:center;position:relative}
.fx{display:block;position:relative;background:#E6D3B1;box-sizing:border-box}

.strip{display:flex;gap:8px;overflow:hidden;flex:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}

.tl2.on{box-shadow:inset 0 0 0 2px #21201F}
.pv{height:44px;border-radius:10px;background:#EEE2CC;position:relative;overflow:hidden}

.tl2 i{font-style:normal;font-size:12px;line-height:14px;color:#6E6B66;white-space:nowrap}
.pill{flex:none;height:36px;border-radius:19px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 13px;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.pill.on{background:#21201F;color:#fff}
.sw{width:30px;height:30px;border-radius:50%;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{box-shadow:0 0 0 2px #F2F1EE,0 0 0 4px #21201F}
.box{background:#fff;border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:none}

<div class="app">
<div class="hdr" style="padding-bottom:0"><a class="ib" href="Editor.dc.html" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><span class="grow"></span><span class="st c-gray" style="background:#fff;height:32px;font-size:14px">{{matLabel}}</span></div>
<div class="body" style="gap:8px;padding-top:2px">
<div class="ttl">Стиль фасада</div>
<div class="hero" aria-label="Шкаф, выбранные фасады выделены">

<sc-for list="{{fac}}" as="f" hint-placeholder-count="3"><i class="fx {{f.cls}}" style="{{f.st}}{{f.svg}}"></i></sc-for>
</div>

</div>
<div class="seg"><button class="sg {{allC}}" onClick="{{setAll}}">Все фасады · 3</button><button class="sg {{oneC}}" onClick="{{setOne}}">Этот фасад</button></div>

<div class="sh">Фрезеровка<span>цена за фасад</span></div>
<div class="strip"><sc-for list="{{mills}}" as="m" hint-placeholder-count="8"><button class="tl2 {{m.on}}" onClick="{{m.pick}}"><span class="pv" style="{{m.svg}}"></span><b>{{m.t}}</b><i>{{m.p}}</i></button></sc-for></div>

<sc-if value="{{needMdf}}" hint-placeholder-val="{{ false }}">
<div class="ban est" style="flex-direction:column;align-items:stretch;gap:8px;padding:10px 10px 10px 14px;margin-top:-2px"><div style="display:flex;align-items:center;gap:8px"><span style="flex:none;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg></span><span class="bt" style="font-size:14px;line-height:18px">Фрезеровка только по МДФ</span><span class="bd" style="margin-left:auto;font-size:13px">по ЛДСП нельзя</span></div><button class="soft sm" onClick="{{toMdf}}" style="background:#fff;height:36px;font-size:14px;width:100%">Заменить на МДФ под покраску</button></div>
</sc-if>

<div class="sh">Накладной декор</div>
<div class="strip" style="-webkit-mask-image:none;mask-image:none"><sc-for list="{{decs}}" as="d" hint-placeholder-count="5"><button class="pill {{d.on}}" onClick="{{d.pick}}">{{d.t}}</button></sc-for></div>

<div class="box">
<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">Рамка или кант</b><span class="cap" style="font-size:13px">{{frameP}}</span></div>
<div class="strip" style="gap:6px"><sc-for list="{{frames}}" as="r" hint-placeholder-count="5"><button class="pill {{r.on}}" onClick="{{r.pick}}" style="background:{{r.bg}};height:36px;font-size:13px;padding:0 12px">{{r.t}}</button></sc-for></div>
<div style="display:flex;align-items:center;gap:12px"><span class="cap" style="font-size:13px;width:62px">Отделка</span><sc-for list="{{fins}}" as="c" hint-placeholder-count="4"><button class="sw {{c.on}}" onClick="{{c.pick}}" style="background:{{c.c}}" aria-label="{{c.t}}"></button></sc-for><span style="font-size:13px;font-weight:600">{{finName}}</span></div>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:0 4px"><b style="font-size:15px;flex:1">Скругление углов</b><sc-for list="{{rads}}" as="q" hint-placeholder-count="4"><button class="pill {{q.on}}" onClick="{{q.pick}}" style="height:36px;padding:0 11px;font-size:13px">{{q.t}}</button></sc-for></div>
</div>
<div class="bbar">
<div style="flex:1;min-width:0"><div class="cap" style="font-size:13px;line-height:16px">{{scopeLabel}}</div><div style="font-size:20px;line-height:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap">{{total}} <span style="font-size:15px;font-weight:400;color:#6E6B66">сум</span></div></div>
<a class="cta" href="Editor.dc.html" style="flex:none;padding:0 26px">Применить</a>
</div>
</div>

 ['Рифл. верт.', 190000, Array.from({length:9},(_,i)=>`<path d="M${8+i*5.5} 6V52" ${ink} stroke-width="1.6"/>`).join('')],
 ['Рифл. гор.', 190000, Array.from({length:8},(_,i)=>`<path d="M6 ${8+i*6}H54" ${ink} stroke-width="1.6"/>`).join('')],
 ['Волны', 230000, [12,22,32,42].map(y=>`<path d="M6 ${y}q6-6 12 0t12 0 12 0 12 0" ${ink} stroke-width="1.6"/>`).join('')]];
const D = [['Нет',0],['Рамка',90000],['Арка',140000],['Ромб',110000],['Молдинг',160000]];
const F = [['Нет',0],['Рамка',150000],['Линия гор.',70000],['Линия верт.',70000],['Кант по краю',110000]];
const C = [['Латунь','#C9A45C'],['Золото','#D9B44A'],['Чёрный','#24231F'],['Хром','#C9CDD1']];
const R = [['Нет',0],['R4',0],['R12',20000],['R30',45000]];
const n = s.one ? 1 : 3;
const per = P[s.mill][1] + D[s.dec][1] + F[s.frame][1] + R[s.rad][1];
const mdfAdd = s.mdf ? 260000 * n : 0;
const tot = per * n + mdfAdd;
const fmt = (v) => (v === 0 ? '0' : '+ ' + v.toLocaleString('ru-RU'));
const needMdf = s.mill > 0 && !s.mdf;
const pv = P[s.mill][2];
const fac = [0,1,2].map(i => {
  const sel = s.one ? i === 1 : true;
  return { cls: sel ? 'sel' : 'dim', st: (i === 2 ? 'border-radius:0 30px 0 0;' : '') + 'background-color:' + (s.mdf ? '#ECE6DA' : '#E6D3B1') + ';',
    svg: pv ? sv(pv.replace(/#A88A5E/g, s.mdf ? '#B9AE9C' : '#B99766')) : '' };
});
return {
fac, matLabel: s.mdf ? 'МДФ под покраску' : 'ЛДСП 18 · Дуб Сонома',
selLabel: s.one ? 'Средний фасад' : 'Все 3 фасада',
allC: s.one ? '' : 'on', oneC: s.one ? 'on' : '',
setAll: () => this.setState({ one: false }), setOne: () => this.setState({ one: true }),
mills: P.map((m, i) => ({ t: m[0], p: m[1] ? '+' + (m[1] / 1000) + ' тыс.' : 'без доплаты', svg: m[2] ? sv(m[2]) : '', on: i === s.mill ? 'on' : '', pick: () => this.setState({ mill: i }) })),
needMdf, toMdf: () => this.setState({ mdf: true }),
decs: D.map((d, i) => ({ t: d[0], on: i === s.dec ? 'on' : '', pick: () => this.setState({ dec: i }) })),
frames: F.map((f, i) => ({ t: f[0], on: i === s.frame ? 'on' : '', bg: i === s.frame ? '#21201F' : '#F2F1EE', pick: () => this.setState({ frame: i }) })),
frameP: s.frame ? '+' + (F[s.frame][1] / 1000) + ' тыс. за фасад' : 'без рамки',
fins: C.map((c, i) => ({ t: c[0], c: c[1], on: i === s.fin ? 'on' : '', pick: () => this.setState({ fin: i }) })),
finName: C[s.fin][0],
rads: R.map((r, i) => ({ t: r[0], on: i === s.rad ? 'on' : '', pick: () => this.setState({ rad: i }) })),
scopeLabel: (s.one ? '1 фасад' : '3 фасада') + (s.mdf ? ' · с заменой на МДФ' : ''),
total: fmt(tot)
};
}
}
