[project]
name = "mebel-api"
version = "0.1.0"
description = "REST API: вход по коду, цеха, клиенты, проекты, версии модели, ссылки клиента"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mebel-core",
    "mebel-ai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "httpx>=0.27",  # SMS Eskiz
]

[tool.uv.sources]
mebel-core = { path = "../core", editable = true }
mebel-ai = { path = "../ai", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mebel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx`",
]
